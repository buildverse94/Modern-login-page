<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <img src="https://i.pinimg.com/1200x/5d/64/37/5d6437bca519a951a3cd977eb99e7b86.jpg">
            <div class="overplay-text">
                EXPLORE.<br>
                LEARN.<br>
                GROW.
            </div>
        </div>

        <div class="right-panel">
            <h1>WELCOME BACK!</h1>
            <p>Enter your email and password</p>

            <form action="">
                <label>Email</label>
                <input type="email" placeholder="Enter email">

                <label>Password</label>
                <input type="password" placeholder="Enter password">

                <div class="options">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" id="forgot">Forgot Password?</a>
                </div>

                <button class="signin">Sign In</button>

                <div class="social-login">
                    <a href="#" class="google-btn">
                        <img src="https://tse3.mm.bing.net/th/id/OIP.XbqE5Y4lHLfTwFbhPe5pjwHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Google">
                        Continue with Google
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
